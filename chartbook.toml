[config]
type = "pipeline"
chartbook_format_version = "0.0.2"

[site]
title = "Treasury Spot-Futures"
author = "George Lord, Max Zhalilo"
copyright = "2025"
logo_path = ""
favicon_path = ""

[pipeline]
id = "TR"
pipeline_name = "Treasury Spot-Futures"
pipeline_description = "A data science project"
lead_pipeline_developer = "George Lord, Max Zhalilo"
contributors = ["George Lord, Max Zhalilo"]
software_modules_command = "module load anaconda3/3.11.4 TeXLive/2023"
runs_on_grid_or_windows_or_other = "Windows/Linux/MacOS"
git_repo_URL = ""
README_file_path = "./README.md"

[notebooks]


[notebooks.treasury_spot_futures_tour]
notebook_name = "Treasury Spot-Futures Project Tour"
notebook_description = "Guided tour of cleaned inputs, spread calculations, and core arbitrage spread output."
notebook_path = "_output/treasury_spot_futures_tour_ipynb.ipynb"




[dataframes]


[dataframes.bloomberg]
dataframe_name = "Bloomberg Treasury Futures and OIS Data"
short_description_df = "Treasury futures contracts (2Y, 5Y, 10Y, 30Y, Ultra 10Y) and OIS rates data from Bloomberg Terminal."
data_sources = ["Bloomberg Terminal"]
data_providers = ["Bloomberg L.P."]
links_to_data_providers = ["https://www.bloomberg.com/professional/solution/bloomberg-terminal/"]
topic_tags = ["Treasury Futures", "Interest Rate Swaps", "OIS", "Fixed Income"]
type_of_data_access = "Proprietary"
data_license = "Yes"
license_expiration_date = "N/A"
need_to_contact_provider = "Yes"
provider_contact_info = "Bloomberg Terminal subscription required"
restriction_on_use = "Yes - Bloomberg Terminal license required"
how_is_pulled = "Bloomberg Terminal API via Python (xbbg package)"
path_to_parquet_data = "./_data/bloomberg.parquet"
path_to_excel_data = ""
date_col = "Date"
dataframe_docs_path = "./docs_src/dataframes/bloomberg.md"


[charts]


[charts.treasury_futures_prices]
chart_name = "Arbitrage Spreads by Tenor"
short_description_chart = "Time series of Treasury spot-futures arbitrage spreads for 2Y, 5Y, 10Y, 20Y, and 30Y tenors."
dataframe_id = "bloomberg"
topic_tags = ["Treasury Futures", "Arbitrage", "Fixed Income", "Spreads"]
data_series_start_date = "2010-01-01"
data_frequency = "Daily"
observation_period = "Weekday"
lag_in_data_release = "One day"
data_release_dates = "Weekday"
seasonal_adjustment = "None"
units = "Basis Points"
data_series = "2Y, 5Y, 10Y, 20Y, 30Y arbitrage spreads"
mnemonic = ""
path_to_html_chart = "./_output/arbitrage_spreads_by_tenor.html"
path_to_excel_chart = ""
